<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width = device-width, initial-scale = 1">
        <style>
             body, html {
                height: 100%;
                background-color: black;
                color: white;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
    position: relative;
    color: #aaa;

    height: 20em;
    width: 30em;
    max-width: 80%;
    max-height: 80%;

    background-color: #333;
    border-radius: 0.1em;

    border: none; /* remove old border */

    display: flex;
    flex-direction: column;

    transition: color 0.2s ease;
    overflow: hidden;

    font-family: nswui, monospace;
    font-weight: bold;
    font-size: 20px;

    margin: 5px;
    text-align: center;
    padding: 10px;

    z-index: 1;
}

/* animated gradient border */
#box::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;

    background: linear-gradient(
        90deg,
        #5ddcff,
        #3c67e3,
        #4e00c2,
        #3c67e3,
        #5ddcff
    );

    background-size: 300% 100%;
    background-position: 0% 50%;

    opacity: 0;
    transition: opacity 0.2s ease;

    z-index: -1;

    animation: flow 8s linear infinite;
}

/* inner fill layer */
#box::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: inherit;

    background-color: #333;

    z-index: -1;
}

/* activate border on hover or drag */
#box:hover::before,
#box[drag]::before {
    opacity: 1;
}

/* hover text behavior (kept from your original) */
#box:hover,
#box[drag] {
    color: #ddd;
}

/* smooth motion */
@keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}
            #advanced {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.1em;
                border: 2px solid #555;

            @font-face {
                font-family: 'nswui';
                src: url('nswui.ttf') format('truetype');

                        #minigames {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.1em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;

            #input {
                cursor: pointer;

            #display {
                width: 100%;

            }

            select, button {
                padding: 0.6em 0.4em;

                font-weight: bold;

                background-color: #444;

                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

@property --glow1 {
    syntax: "<color>";
    initial-value: red;
    inherits: false;
}

@property --glow2 {
    syntax: "<color>";
    initial-value: blue;
    inherits: false;
}

@property --glowBlur {
    syntax: "<length>";
    initial-value: 8px;
    inherits: false;
}

.logo {
    width: 512px;
    height: 137.5px;

    filter:
        drop-shadow(0 0 var(--glowBlur) var(--glow1))
        drop-shadow(0 0 calc(var(--glowBlur) * 1.5) var(--glow2));

    animation: rainbowGlow 7s ease-in-out infinite;
}

/* smooth rainbow cycling */
@keyframes rainbowGlow {
    0% {
        --glow1: #ff0000;
        --glow2: #ff7a00;
        --glowBlur: 8px;
    }

    16% {
        --glow1: #ff7a00;
        --glow2: #ffff00;
        --glowBlur: 9px;
    }

    33% {
        --glow1: #00ff00;
        --glow2: #00ffff;
        --glowBlur: 10px;
    }

    50% {
        --glow1: #0080ff;
        --glow2: #7a00ff;
        --glowBlur: 11px;
    }

    66% {
        --glow1: #ff00ff;
        --glow2: #ff007a;
        --glowBlur: 10px;
    }

    83% {
        --glow1: #ff007a;
        --glow2: #ff0000;
        --glowBlur: 9px;
    }

    100% {
        --glow1: #ff0000;
        --glow2: #ff7a00;
        --glowBlur: 8px;
    }
}
.switchII {
    position: relative;
    display: inline-block;
    padding: 10px 18px;

    color: white;
    font-family: nswui;
    font-size: 14px;
    text-decoration: none;

    background: rgba(255, 255, 255, 0.05);
    border-radius: 0.5px;
    border: none;

    z-index: 1;
}

.switchII::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;

    /* smooth cyclic gradient (no harsh repeat point) */
    background: linear-gradient(
        90deg,
        #5ddcff,
        #3c67e3,
        #4e00c2,
        #3c67e3,
        #5ddcff
    );

    background-size: 300% 100%;
    background-position: 0% 50%;

    opacity: 0;
    transition: opacity 0.2s ease;

    z-index: -1;

            #inputAdvanced {
    font-family: nswui;
    color: #aaa;
    background: transparent;
    border: none;
}

/* base + hover use SAME inner color */
#inputAdvanced::file-selector-button {
    padding: 10px 18px;
    margin-right: 12px;

    font-family: nswui;
    font-size: 14px;
    color: white;

    border: none;
    border-radius: 0.5px;

    cursor: pointer;

    /* unified base color (same as hover inner fill) */
    background: rgba(20, 20, 30, 0.95);

    transition: all 0.2s ease;
}

/* hover only adds gradient border */
#inputAdvanced::file-selector-button:hover {
    background:
        linear-gradient(rgba(20, 20, 30, 0.95), rgba(20, 20, 30, 0.95)) padding-box,
        linear-gradient(
            90deg,
            #5ddcff,
            #3c67e3,
            #4e00c2,
            #3c67e3,
            #5ddcff
        ) border-box;

    border: 3px solid transparent;

    background-size: 300% 100%;
    animation: flow 8s linear infinite;
}

/* animation */
@keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

                margin: 5px;
            }

    <body>
        <div id="top">
            <h1 style="font-family:nswui;">EmulatorJS PLUS!</h1>
            <img src="docs/nnp-logo.png" alt="Logo" class="logo">
            <br>
        </div>
        <div id="box">
            <input type="file" id ="input" title="Upload" />
            Drag ROM file or click here
        </div>
        <div id="advanced">
            <div id="advancedToggleBox">
                <input type="checkbox" id="advancedToggle" />
                <label for="advancedToggle"> Show Advanced Options</label>
            </div>
            <div id="advancedOptionsBox">
                <div class="advancedOptionsBoxRow">
                    <label class="switchII fileWrap">
    Choose BIOS file (if required)
    <input type="file" id="inputAdvanced" />
</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <input type="checkbox" id="debugToggle" />
                    <label for="debugToggle"> Enable Debug Mode</label>
                </div>
                <div id="advancedOptionsBoxThreads" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="threadsToggle" />
                    <label for="threadsToggle"> Enable Threads</label>
                </div>
                <div id="advancedOptionsCache" class="advancedOptionsBoxRow">
                    <input type="checkbox" id="cacheToggle" checked="checked" />
                    <label for="cacheToggle"> Enable Cache</label>
                </div>
                <div class="advancedOptionsBoxRow">
                    <span>Browser mode: </span>
                    <input type="radio" id="browserModeAuto" name="browserMode" value="auto">
                    <label for="browserModeAuto"> Auto </label>
                    <input type="radio" id="browserModeDesktop" name="browserMode" value="desktop">
                    <label for="browserModeDesktop"> Desktop </label>
                    <input type="radio" id="browserModeMobile" name="browserMode" value="mobile">
                    <label for="browserModeMobile"> Mobile </label>
                </div>
            </div>
        </div>
                <div id="minigames">
            <div id="minigammeToggleBox">
                <input type="checkbox" id="minigameToggle" />
                <label for="minigameToggle"> Minigames</label>
            </div>
            <div id="minigameOptionsBox">
                <div class="minigameOptionsBoxRow">
                    <a href="mini%20games/eaglercraft/188/EaglerFrameinit.html" class="switchII">
                        Minecraft 1.8.8
                    </a>
                </div>
                 <div class="minigameOptionsBoxRow">
                    <a href="mini%20games/cookie%20clicker/index.html" class="switchII">
                        Cookie Clicker
                    </a>
                </div>
                <div class="minigameOptionsBoxRow">
                    <a href="mini%20games/blockblast/index.html" class="switchII">
                        Block Blast!
                    </a>
                </div>
                <div class="minigameOptionsBoxRow">
                    <a href="mini%20games/dusk/shell.html" class="switchII">
                        DuskLight
                    </a>
                </div>
            </div>
        </div>

        <script>
            let enableDebug = false;
            let enableThreads = false;
            let browserMode;

            const biosFileInput = document.getElementById("inputAdvanced");
            
            const advancedToggle = document.getElementById("advancedToggle");
            const advanced = document.getElementById("advanced");
            const advancedOptionsBox = document.getElementById("advancedOptionsBox");
            advancedOptionsBox.style.display = "none";
            advancedToggle.addEventListener("change", (event) => {
                if (event.target.checked) {
                    advancedOptionsBox.style.display = "block";
                } else {
                    advancedOptionsBox.style.display = "none";
                }
            });

             const minigameToggle = document.getElementById("minigameToggle");
            const minigames = document.getElementById("minigames");
            const minigameOptionsBox = document.getElementById("minigameOptionsBox");
            minigameOptionsBox.style.display = "none";
            minigameToggle.addEventListener("change", (event) => {
                if (event.target.checked) {
                    minigameOptionsBox.style.display = "block";
                } else {
                    minigameOptionsBox.style.display = "none";
                }
            });

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const debugToggle = document.getElementById("debugToggle");
            debugToggle.addEventListener("change", (event) => {
                enableDebug = event.target.checked;
                console.log(`Debug is ${enableDebug ? "enabled" : "disabled"}`);
            });
            const cacheToggle = document.getElementById("cacheToggle");
            window.EJS_cacheConfig = {
                enabled: true,
                cacheMaxSizeMB: 4096, // 4096 MB = 4 GB
                cacheMaxAgeMins: 7200 // 7200 minutes = 5 days
            };
            cacheToggle.addEventListener("change", (event) => {
                const cacheEnabled = event.target.checked;
                console.log(`Cache is ${cacheEnabled ? "enabled" : "disabled"}`);
                window.EJS_cacheConfig.enabled = cacheEnabled;
            });
            const threadsToggleAvailable = document.getElementById("advancedOptionsBoxThreads");
            const threadsToggle = document.getElementById("threadsToggle");
            threadsToggle.addEventListener("change", (event) => {
                enableThreads = event.target.checked;
                console.log(`Threads are ${enableThreads ? "enabled" : "disabled"}`);
            });
            if (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true") {
                enableDebug = true;
                debugToggle.checked = true;
                console.log("Debug is enabled");
            } else {
                debugToggle.checked = false;
                console.log("Debug is disabled");
            }

            if (window.SharedArrayBuffer) {
                threadsToggleAvailable.style.display = "block";
                if (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true") {
                    enableThreads = true;
                    threadsToggle.checked = true;
                    console.log("Threads are enabled");
                } else {
                    threadsToggle.checked = false;
                    console.log("Threads are disabled");
                }
            } else {
                threadsToggleAvailable.style.display = "none";
                console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
            }

            const browserModeAuto = document.getElementById("browserModeAuto");
            browserModeAuto.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = undefined;
                    console.log("Browser mode set to auto");
                }
            });
            const browserModeDesktop = document.getElementById("browserModeDesktop");
            browserModeDesktop.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "desktop";
                    console.log("Browser mode set to desktop");
                }
            });
            const browserModeMobile = document.getElementById("browserModeMobile");
            browserModeMobile.addEventListener("change", (event) => {
                if (event.target.checked) {
                    browserMode = "mobile";
                    console.log("Browser mode set to mobile");
                }
            });
            if (urlParams.get("browserMode")) {
                browserMode = urlParams.get("browserMode");
                switch (browserMode) {
                    case 1:
                    case "1":
                    case "mobile":
                        browserModeMobile.checked = true;
                        break;
                    case 2:
                    case "2":
                    case "desktop":
                        browserModeDesktop.checked = true;
                        break;
                    default:
                        browserModeAuto.checked = true;
                        break;
                }
            } else {
                browserModeAuto.checked = true;
            }

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : `roms/${file}`;
                const parts = upload ? input.files[0].name.split(".") : file.split(".");

                const biosUrl = biosFileInput.files.length > 0 ? biosFileInput.files[0] : "";

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    
                    if (["md", "sg", "smd", "gen"].includes(ext))
                        return "segaMD"

                    if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                        return ext

                    if (["3ds", "cci", "cia", "cxi", "app"].includes(ext))
                        return "3ds"

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet",
                            "Amiga": "puae"
                        }
                        
                        if (enableThreads) {
                            coreValues["DOSBOX-PURE"] = "dosbox_pure";
                            coreValues["PlayStation Portable"] = "ppsspp";
                            coreValues["Nintendo 3DS"] = "3ds";
                        }

                        for (let core in coreValues) {
                            if (core.toLowerCase() === ext) {
                                resolve(core)
                            }
                        }
 
                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove();
                div.appendChild(sub);
                advanced.remove();
                minigames.remove();
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = biosUrl;
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                        alert("The emulator has exited... sux to be u ig lol --NookNation");
                    };

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
