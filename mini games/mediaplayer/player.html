<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSVP</title>

<style>
body{
    font-family: nswui;
    text-align:center;
    background:#111;
    color:white;
    margin:20px;
}
            @font-face {
                font-family: 'nswui';
                src: url('../../nswui.ttf') format('truetype');
                font-display: swap;
            }
                        #minigames {
                color: #aaa;
                text-align: left;
                width: 30em;
                max-width: 80%;
                background-color: #333;
                border-radius: 0.1em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow-y: auto;
                font-family: nswui, monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                padding: 10px;
            }
.switchII {
    position: relative;
    display: inline-block;
    padding: 10px 18px;

    color: white;
    font-family: nswui;
    font-size: 14px;
    text-decoration: none;

    background: rgba(255, 255, 255, 0.05);
    border-radius: 0.5px;
    border: none;

    z-index: 1;
}

.switchII::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;

    /* smooth cyclic gradient (no harsh repeat point) */
    background: linear-gradient(
        90deg,
        #5ddcff,
        #3c67e3,
        #4e00c2,
        #3c67e3,
        #5ddcff
    );

    background-size: 300% 100%;
    background-position: 0% 50%;

    opacity: 0;
    transition: opacity 0.2s ease;

    z-index: -1;

    animation: flow 8s linear infinite;
}

.switchII::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: inherit;

    background: rgba(20, 20, 30, 0.95);

    z-index: -1;
}

.switchII:hover::before {
    opacity: 1;
}

@keyframes flow {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 300% 50%;
    }
}

          #inputAdvanced {
    font-family: nswui;
    color: #aaa;
    background: transparent;
    border: none;
}

/* base + hover use SAME inner color */
#inputAdvanced::file-selector-button {
    padding: 10px 18px;
    margin-right: 12px;

    font-family: nswui;
    font-size: 14px;
    color: white;

    border: none;
    border-radius: 0.5px;

    cursor: pointer;

    /* unified base color (same as hover inner fill) */
    background: rgba(20, 20, 30, 0.95);

    transition: all 0.2s ease;
}

/* hover only adds gradient border */
#inputAdvanced::file-selector-button:hover {
    background:
        linear-gradient(rgba(20, 20, 30, 0.95), rgba(20, 20, 30, 0.95)) padding-box,
        linear-gradient(
            90deg,
            #5ddcff,
            #3c67e3,
            #4e00c2,
            #3c67e3,
            #5ddcff
        ) border-box;

    border: 3px solid transparent;

    background-size: 300% 100%;
    animation: flow 8s linear infinite;
}

/* animation */
@keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}
            #top {
                margin: 5px;
            }
#player{
    max-width:900px;
    width:100%;
    border-radius:10px;
}

.controls{
    margin-top:10px;
}
</style>
</head>
<body>

<h1>NookNation's Simple Video Player</h1>

<video id="player" controls>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support video playback.
</video>

<div class="controls">
    <button class="switchIII" onclick="playVideo()">Play</button>
    <button class="switchIII" onclick="pauseVideo()">Pause</button>
    <button class="switchIII" onclick="stopVideo()">Stop</button>
    
    <input type="file" id="fileInput" accept="video/*">
</div>

<script>
const video = document.getElementById("player");
const fileInput = document.getElementById("fileInput");

function playVideo(){
    video.play();
}

function pauseVideo(){
    video.pause();
}

function stopVideo(){
    video.pause();
    video.currentTime = 0;
}

fileInput.addEventListener("change", function(){
    const file = this.files[0];
    if(file){
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
    }
});
</script>

</body>
</html>
