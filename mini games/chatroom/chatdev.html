<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameChat v5</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
            @font-face {
                font-family: 'nswui';
                src: url('nswui.ttf') format('truetype');
                font-display: swap;
            }
            .switchIII {
                appearance: none;
    position: relative;
    display: inline-block;
    padding: 10px 18px;

    color: white;
    font-family: nswui;
    font-size: 14px;
    text-decoration: none;

    background: rgba(255, 255, 255, 0.05);
    border-radius: 0.5px;
    border: none;

    z-index: 1;
}

.switchIII::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;

    /* smooth cyclic gradient (no harsh repeat point) */
    background: linear-gradient(
        90deg,
        #5ddcff,
        #3c67e3,
        #4e00c2,
        #3c67e3,
        #5ddcff
    );

    background-size: 300% 100%;
    background-position: 0% 50%;

    opacity: 0;
    transition: opacity 0.2s ease;

    z-index: -1;

    animation: flow 8s linear infinite;
}

.switchIII::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: inherit;

    background: rgba(20, 20, 30, 0.95);

    z-index: -1;
}

.switchIII:hover::before {
    opacity: 1;
}

@keyframes flow {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 300% 50%;
    }
}
    
body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border-radius:6px;
    border:none;
    margin:4px;
}

input{
    background:#374151;
    color:white;
}

button{
    cursor:pointer;
    border:none;
}

#chat{
    height:350px;
    overflow-y:auto;
    background:#0f172a;
    padding:10px;
    border-radius:10px;
}

.message{
    margin:6px 0;
    word-wrap:break-word;
}

.system{
    color:#60a5fa;
}

.self{
    color:#4ade80;
}

.other{
    color:#facc15;
}

audio{
    width:100%;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<h1>GameChat</h1>


<div class="card">

<input id="username" placeholder="Username">

<br>

<input id="room" placeholder="Room Code">

<button class="switchIII" onclick="createRoom()">Create Room</button>
<button class="switchIII" onclick="joinRoom()">Join Room</button>

</div>


<div class="card">

<div id="status">
Not connected
</div>

</div>


<div id="chat" class="card"></div>


<div class="card">

<input id="message" placeholder="Message" style="width:70%">

<button class="switchIII" onclick="sendMessage()">Send</button>

<br>

<button class="switchIII" onclick="startVoice()">
Enable Voice
</button>

</div>


<div class="card">

<h3>Voice</h3>

<div id="audioContainer"></div>

</div>


</div>


<script>

let peer;

let isHost=false;

let connections=[];

let hostConnection=null;

let roomCode="";
let username="";

let localStream=null;

let voiceEnabled=false;

let calledPeers=[];



function log(text,cls="system"){

    let div=document.createElement("div");

    div.className="message "+cls;

    div.textContent=text;

    let chat=document.getElementById("chat");

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

}



function setStatus(text){

    document.getElementById("status").textContent=text;

}



function createRoom(){

    username=document.getElementById("username").value.trim();

    roomCode=document.getElementById("room").value.trim();


    if(!username||!roomCode){

        alert("Enter username and room code.");

        return;

    }


    isHost=true;


    peer=new Peer("room-"+roomCode);

    setupCalls();



    peer.on("open",()=>{

        setStatus("Hosting room: "+roomCode);

        log("Room created.");

    });



    peer.on("connection",conn=>{


        if(connections.length>=5){

            conn.close();

            return;

        }


        connections.push(conn);



        conn.on("data",data=>{


            if(data.type==="chat"){

                log(
                    data.user+": "+data.text,
                    "other"
                );


                connections.forEach(c=>{

                    if(c!==conn && c.open){

                        c.send(data);

                    }

                });

            }



            if(data.type==="join"){

                log(
                    data.user+" joined.",
                    "system"
                );


                connections.forEach(c=>{

                    if(c.open){

                        c.send(data);

                    }

                });

            }



            if(data.type==="voice-ready"){


                log(
                    data.user+" enabled voice.",
                    "system"
                );



                // Host calls the new person

                if(voiceEnabled){

                    startCall(data.peerId);

                }



                // Tell everyone else about this person

                connections.forEach(c=>{


                    if(c!==conn && c.open){


                        c.send({

                            type:"new-voice-user",

                            peerId:data.peerId,

                            user:data.user

                        });


                    }


                });


            }



        });



        conn.on("close",()=>{

            connections =
            connections.filter(c=>c!==conn);

        });


    });


}




function joinRoom(){

    username=document.getElementById("username").value.trim();

    roomCode=document.getElementById("room").value.trim();



    if(!username||!roomCode){

        alert("Enter username and room code.");

        return;

    }



    peer=new Peer();

    setupCalls();



    peer.on("open",()=>{


        hostConnection =
        peer.connect("room-"+roomCode);



        hostConnection.on("open",()=>{


            setStatus(
                "Connected to room: "+roomCode
            );


            hostConnection.send({

                type:"join",

                user:username

            });


        });



        hostConnection.on("data",data=>{


            if(data.type==="new-voice-user"){


                log(
                    data.user+" enabled voice.",
                    "system"
                );


                startCall(data.peerId);


            }



            if(data.type==="host-voice-ready"){

                startCall(data.peerId);

            }



            if(data.type==="join"
            && data.user!==username){

                log(
                    data.user+" joined.",
                    "system"
                );

            }



            if(data.type==="chat"
            && data.user!==username){

                log(
                    data.user+": "+data.text,
                    "other"
                );

            }



        });



    });


}




function sendMessage(){


    let box=document.getElementById("message");

    let text=box.value.trim();


    if(!text)return;



    log(
        username+": "+text,
        "self"
    );



    let packet={

        type:"chat",

        user:username,

        text:text

    };



    if(isHost){


        connections.forEach(c=>{

            if(c.open)c.send(packet);

        });


    }

    else{


        if(hostConnection && hostConnection.open){

            hostConnection.send(packet);

        }

    }



    box.value="";


}





async function startVoice(){


    if(voiceEnabled)return;



    try{


        localStream =
        await navigator.mediaDevices.getUserMedia({

            audio:true

        });



        voiceEnabled=true;



        log(
            "Voice enabled.",
            "system"
        );



        let packet={

            type:"voice-ready",

            user:username,

            peerId:peer.id

        };



        if(isHost){


            connections.forEach(c=>{

                if(c.open)c.send(packet);

            });


        }

        else{


            hostConnection.send(packet);


        }



    }

    catch(e){


        alert(
            "Microphone permission denied."
        );


    }


}





function setupCalls(){


    peer.on("call",async call=>{


        if(!localStream){


            localStream =
            await navigator.mediaDevices.getUserMedia({

                audio:true

            });


        }



        call.answer(localStream);



        call.on("stream",stream=>{

            addAudio(stream);

        });



    });


}




function startCall(id){


    if(!localStream)return;


    if(id===peer.id)return;


    if(calledPeers.includes(id))return;



    calledPeers.push(id);



    let call =
    peer.call(
        id,
        localStream
    );



    call.on("stream",stream=>{


        addAudio(stream);


    });


}





function addAudio(stream){


    let audio=document.createElement("audio");


    audio.autoplay=true;

    audio.controls=true;

    audio.srcObject=stream;



    document
    .getElementById("audioContainer")
    .appendChild(audio);


}





document
.getElementById("message")
.addEventListener("keypress",e=>{

    if(e.key==="Enter"){

        sendMessage();

    }

});


</script>

</body>
</html>
