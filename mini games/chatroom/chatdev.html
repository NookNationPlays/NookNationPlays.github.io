<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GameChat v6</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
@font-face{font-family:nswui;src:url("../../nswui.ttf")}
body{font-family:nswui,Arial;background:#111827;color:white;padding:20px}
.card{background:#1f2937;padding:15px;border-radius:10px;margin:10px}
button{padding:10px;margin:4px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}
input{padding:10px;background:#374151;color:white;border:0;border-radius:6px}
#chat{height:250px;overflow:auto;background:#0f172a;padding:10px}
video{width:320px;aspect-ratio:16/9;background:black;border-radius:10px}
</style>
</head>
<body>
<h1>GameChat v6</h1>

<div class="card">
<input id="username" placeholder="Username">
<input id="room" placeholder="Room Code">
<button onclick="createRoom()">Create</button>
<button onclick="joinRoom()">Join</button>
</div>

<div class="card" id="status">Not connected</div>

<div class="card" id="chat"></div>

<div class="card">
<input id="msg" placeholder="Message">
<button onclick="sendMessage()">Send</button><br>
<button onclick="enableVoice()">Enable Voice</button>
<button onclick="enableCamera()">Enable Camera</button>
</div>

<div class="card">
<h3>Video</h3>
<div id="videos"></div>
</div>

<script>
let peer,isHost=false,hostConnection;
let connections=[];
let username="",room="";
let audioStream=null,videoStream=null;
let voice=false,camera=false;
let calledAudio=[],calledVideo=[];

function log(t){
 let d=document.createElement("div");
 d.textContent=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

function createRoom(){
 username=usernameInput.value.trim(); room=roomInput.value.trim();
 if(!username||!room)return;
 isHost=true;
 peer=new Peer("room-"+room);
 setupCalls();
 peer.on("open",()=>status.textContent="Hosting "+room);
 peer.on("connection",addConnection);
}

function joinRoom(){
 username=usernameInput.value.trim(); room=roomInput.value.trim();
 peer=new Peer();
 setupCalls();
 peer.on("open",()=>{
  hostConnection=peer.connect("room-"+room);
  hostConnection.on("open",()=>{
   status.textContent="Connected";
   hostConnection.send({type:"join",user:username});
  });
  hostConnection.on("data",handleData);
 });
}

function addConnection(c){
 connections.push(c);
 c.on("data",d=>handleData(d,c));
}

function handleData(d,c){
 if(d.type=="chat"){
  log(d.user+": "+d.text);
  if(isHost)connections.forEach(x=>x.send(d));
 }
 if(d.type=="join"){
  log(d.user+" joined");
 }
 if(d.type=="voice"){
  if(voice)callPeer(d.id,"audio");
  connections.forEach(x=>x.send(d));
 }
 if(d.type=="camera"){
  if(camera)callPeer(d.id,"video");
  connections.forEach(x=>x.send(d));
 }
}

function sendMessage(){
 let t=msg.value.trim(); if(!t)return;
 log(username+": "+t);
 let d={type:"chat",user:username,text:t};
 if(isHost)connections.forEach(c=>c.send(d));
 else hostConnection.send(d);
 msg.value="";
}

async function enableVoice(){
 if(voice)return;
 audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
 voice=true;
 let d={type:"voice",id:peer.id};
 if(isHost)connections.forEach(c=>c.send(d)); else hostConnection.send(d);
 log("Voice enabled");
}

async function enableCamera(){
 if(camera)return;
 videoStream=await navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:1280},height:{ideal:720}}
 });
 camera=true;
 showVideo(videoStream,true);
 let d={type:"camera",id:peer.id};
 if(isHost)connections.forEach(c=>c.send(d)); else hostConnection.send(d);
 log("Camera enabled");
}

function setupCalls(){
 peer.on("call",call=>{
  call.answer(call.metadata=="video"?videoStream:audioStream);
  call.on("stream",s=>{
   if(call.metadata=="video")showVideo(s,false);
   else{
    let a=new Audio();
    a.srcObject=s;a.autoplay=true;
    document.body.appendChild(a);
   }
  });
 });
}

function callPeer(id,type){
 let stream=type=="video"?videoStream:audioStream;
 if(!stream)return;
 let call=peer.call(id,stream,{metadata:type});
 call.on("stream",s=>{
  if(type=="video")showVideo(s,false);
  else{
   let a=new Audio();
   a.srcObject=s;a.autoplay=true;
   document.body.appendChild(a);
  }
 });
}

function showVideo(s,local){
 let v=document.createElement("video");
 v.autoplay=true;
 v.playsInline=true;
 v.muted=local;
 v.srcObject=s;
 videos.appendChild(v);
}

let usernameInput=document.getElementById("username");
let roomInput=document.getElementById("room");
</script>
</body>
</html>
